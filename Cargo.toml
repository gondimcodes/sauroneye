[package]
name = "sauroneye"
version = "1.0.6"



edition = "2021"
authors = ["SauronEye Team"]
description = "High-Performance File Integrity Monitoring, Auth Auditing, and RCE/Intrusion Sentinel Daemon in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# High-Performance Fingerprinting (Scalar & SIMD friendly, zero AVX lock-in)
blake3 = "1.5"
twox-hash = "2.1"

# Database & Storage (SQLite3 with WAL mode)
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Cryptography & Password Hashing
argon2 = "0.5"
rand = "0.8"

# CLI & Terminal
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.3"

# System, Linux FS & Kernel Netlink
nix = { version = "0.29", features = ["fs", "user", "signal", "process", "hostname"] }
libc = "0.2"

# HTTP Client (Alerting: Telegram & WhatsApp)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# SMTP Email Dispatch
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# PDF Generation (idêntico ao padrão signalhunter com printpdf 0.12.5 sem vulnerabilidades)
printpdf = { version = "0.12.5", default-features = false }

# Logging, Tracing & Time
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }

# Glob & Pattern Matching
glob = "0.3"
walkdir = "2.5"
notify = "6.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
