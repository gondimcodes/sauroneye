kind: pipeline
name: test-and-release

steps:
  test:
    image: rust:latest
    commands:
      - cargo test --workspace -j 1
    when:
      event: [push, pull_request]

  build:
    image: rust:latest
    commands:
      - cargo build --release -j 1
      - strip target/release/sauroneye
      - mkdir -p dist
      - cp target/release/sauroneye dist/sauroneye
      - cp config.toml.example README.md README.pt-BR.md INSTALL.md INSTALL.pt-BR.md TECH_STACK.md LICENSE dist/
      - cd dist
      - tar -czf sauroneye-$${CI_COMMIT_TAG}-linux-x86_64.tar.gz sauroneye config.toml.example README.md README.pt-BR.md INSTALL.md INSTALL.pt-BR.md TECH_STACK.md LICENSE
    when:
      event: tag

  publish:
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: codeberg_token
      base_url: https://codeberg.org
      files:
        - dist/sauroneye-*.tar.gz
    when:
      event: tag
