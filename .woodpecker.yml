kind: pipeline
name: test-and-release

steps:
  test:
    image: rust:latest
    commands:
      - cargo test --workspace -j 1
    when:
      event: [push, pull_request]

  build:
    image: rust:latest
    commands:
      - apt-get update && apt-get install -y musl-tools
      - rustup target add x86_64-unknown-linux-musl
      - cargo build --release --target x86_64-unknown-linux-musl -j 1
      - strip target/x86_64-unknown-linux-musl/release/sauroneye
      - mkdir -p dist
      - cp target/x86_64-unknown-linux-musl/release/sauroneye dist/sauroneye
      - cp config.toml.example README.md README.pt-BR.md INSTALL.md INSTALL.pt-BR.md TECH_STACK.md LICENSE dist/
      - cd dist
      - tar -czf sauroneye-$${CI_COMMIT_TAG}-x86_64-unknown-linux-musl.tar.gz sauroneye config.toml.example README.md README.pt-BR.md INSTALL.md INSTALL.pt-BR.md TECH_STACK.md LICENSE
    when:
      event: tag

  publish:
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: codeberg_token
      base_url: https://codeberg.org
      files:
        - dist/sauroneye-*.tar.gz
    when:
      event: tag
