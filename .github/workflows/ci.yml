name: CI/CD (Linux Native & Release)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. CI: Validação de Código, Linter, Auditoria e Testes em Linux (Ubuntu)
  # ============================================================================
  check-and-test:
    name: Lint, Audit & Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo Dependencies & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Cargo Check
        run: cargo check --verbose

      - name: Cargo Clippy (Linting)
        run: cargo clippy -- -D warnings || true

      - name: Install and Run Cargo Audit (Security)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

  # ============================================================================
  # 2. CD: Build do Binário Release para Linux e Publicação de Release
  # ============================================================================
  build-release:
    name: Build Release Binary (Linux x86_64)
    needs: check-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Build Optimized Release Binary
        run: |
          cargo build --release
          strip target/release/sauroneye

      - name: Package Release Artifacts (Tarball)
        run: |
          mkdir -p dist
          cp target/release/sauroneye dist/
          cp config.toml.example README.md README.pt-BR.md INSTALL.md INSTALL.pt-BR.md TECH_STACK.md LICENSE dist/
          tar -czvf sauroneye-linux-x86_64.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sauroneye-linux-x86_64
          path: sauroneye-linux-x86_64.tar.gz
          retention-days: 14

      - name: Create GitHub Release (On Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sauroneye-linux-x86_64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
